<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accenty — CRM</title>
    <link rel="icon" type="image/png" href="/admin/favicon.png" />
    <!-- Prevent flash of wrong theme / glass: apply before first paint -->
    <script>
      (function () {
        var valid = [
          "dark-1","dark-2","dark-3","dark-4","dark-5",
          "dark-6","dark-7","dark-8","dark-9","dark-10",
          "dark-11","dark-12","dark-13","dark-14","dark-15",
          "dark-16","dark-17","dark-18","dark-19","dark-20",
          "light-1","light-2","light-3","light-4","light-5",
          "light-6","light-7","light-8","light-9","light-10",
        ];
        var root = document.documentElement;
        var theme, glass, opacity, blur, bg;
        try { theme = localStorage.getItem("accenty.crm.theme.v2"); } catch (_) {}
        try { glass = localStorage.getItem("accenty.crm.glass.v1"); } catch (_) {}
        try { opacity = localStorage.getItem("accenty.crm.glass-opacity.v1"); } catch (_) {}
        try { blur = localStorage.getItem("accenty.crm.glass-blur.v1"); } catch (_) {}
        try { bg = localStorage.getItem("accenty.crm.background.v3") || localStorage.getItem("accenty.crm.background.v2") || localStorage.getItem("accenty.crm.background.v1"); } catch (_) {}

        root.setAttribute(
          "data-theme",
          theme && valid.indexOf(theme) !== -1 ? theme : "light-10"
        );

        var glassOn = glass === "1" || glass === "true";
        root.setAttribute("data-glass", glassOn ? "true" : "false");

        root.setAttribute("data-bg", bg && bg.length ? bg : "static");

        var op = Number(opacity);
        if (!Number.isFinite(op)) op = 23;
        op = Math.min(100, Math.max(0, Math.round(op)));
        var t = op / 100;
        var alpha = 0.04 + t * 0.5;
        var alphaStrong = Math.min(0.72, alpha + 0.12);
        root.style.setProperty("--glass-alpha", alpha.toFixed(3));
        root.style.setProperty("--glass-alpha-strong", alphaStrong.toFixed(3));
        root.style.setProperty("--glass-accent-alpha", (0.02 + t * 0.28).toFixed(3));
        root.style.setProperty("--glass-shine-alpha", (0.06 + t * 0.22).toFixed(3));

        var bl = Number(blur);
        if (!Number.isFinite(bl)) bl = 13;
        bl = Math.min(60, Math.max(0, Math.round(bl)));
        var blSm = Math.max(0, Math.round(bl * 0.7));
        root.style.setProperty("--glass-blur", bl + "px");
        root.style.setProperty("--glass-blur-sm", blSm + "px");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Boot + auth: Cinzel eyebrow, Cormorant editorial title, Montserrat UI -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Michroma&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Michroma&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/admin/boot-loader.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #04060c;
      }
      html[data-theme^="light"] body {
        background: #eef1f7;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" id="boot-loader" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-atmo boot-atmo-radial" aria-hidden></div>
        <div class="boot-atmo boot-atmo-vignette" aria-hidden></div>
        <div class="boot-atmo boot-atmo-scan" aria-hidden></div>
        <div class="boot-card">
          <p class="boot-eyebrow">Accenty CRM</p>
          <h1 class="boot-title">Accenty</h1>
          <div class="boot-progress" aria-hidden>
            <span class="boot-progress__beam"></span>
          </div>
          <p class="boot-caption">Loading</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
