name: Deploy Frontend

# Production frontend is Cloudflare Pages on Accenty-AI/CRM-Frontend
# (Git integration builds on push to prod). This repo's AWS/ECS path is retired.
on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Point to Cloudflare Pages repo
        run: |
          echo "Frontend deploys via Cloudflare Pages from Accenty-AI/CRM-Frontend."
          echo "Push to that repo's prod branch (or use wrangler pages deploy)."
          exit 0
